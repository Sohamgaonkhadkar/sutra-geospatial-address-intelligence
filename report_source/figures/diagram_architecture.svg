<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1250" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60584B"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C4501B"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B7449"/>
    </marker>
  </defs>
  <rect width="1200" height="1250" fill="#FBF9F2"/>
  <text x="28" y="42" font-size="24" font-weight="bold" fill="#211D14" font-family="DejaVu Serif, serif">SUTRA end-to-end architecture — production, field evidence, offline</text>
  <text x="28" y="68" font-size="13" fill="#60584B">schematic · orange = production · green = evidence · plum = memory · slate = offline-only · arrows = data flow</text>

  <!-- ── lane 1: production request path ─────────────────────────────────── -->
  <rect x="24" y="92" width="1152" height="330" fill="#F5E0CF" opacity="0.35" stroke="#C4501B" stroke-width="1.4"/>
  <text x="40" y="122" font-size="14" fill="#A63E12" font-weight="bold" font-family="DejaVu Sans Mono, monospace">PRODUCTION REQUEST PATH · one deterministic, reason-coded pipeline</text>

  <g font-size="14" fill="#211D14">
    <rect x="40" y="146" width="172" height="70" rx="7" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.6"/>
    <text x="54" y="175">raw address</text><text x="54" y="197" fill="#60584B" font-size="12">+ request purpose</text>
    <rect x="230" y="146" width="172" height="70" rx="7" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.6"/>
    <text x="244" y="175">normalise / parse</text><text x="244" y="197" fill="#60584B" font-size="12">NFKC · abbrev · spans</text>
    <rect x="420" y="146" width="172" height="70" rx="7" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.6"/>
    <text x="434" y="175">entity resolution</text><text x="434" y="197" fill="#60584B" font-size="12">town · locality (v2)</text>
    <rect x="610" y="146" width="180" height="70" rx="7" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.6"/>
    <text x="624" y="175">candidate generation</text><text x="624" y="197" fill="#60584B" font-size="12">5 static + evidence arms</text>
    <rect x="808" y="146" width="172" height="70" rx="7" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.6"/>
    <text x="822" y="175">RULE ranker</text><text x="822" y="197" fill="#60584B" font-size="12">reason-coded · frozen</text>
    <rect x="998" y="146" width="162" height="70" rx="7" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.6"/>
    <text x="1012" y="175">belief + uncertainty</text><text x="1012" y="197" fill="#60584B" font-size="12">tier · radius map v1</text>

    <line x1="212" y1="181" x2="226" y2="181" stroke="#C4501B" stroke-width="1.8" marker-end="url(#arro)"/>
    <line x1="402" y1="181" x2="416" y2="181" stroke="#C4501B" stroke-width="1.8" marker-end="url(#arro)"/>
    <line x1="592" y1="181" x2="606" y2="181" stroke="#C4501B" stroke-width="1.8" marker-end="url(#arro)"/>
    <line x1="790" y1="181" x2="804" y2="181" stroke="#C4501B" stroke-width="1.8" marker-end="url(#arro)"/>
    <line x1="980" y1="181" x2="994" y2="181" stroke="#C4501B" stroke-width="1.8" marker-end="url(#arro)"/>

    <rect x="610" y="266" width="230" height="70" rx="7" fill="#C4501B" stroke="#A63E12" stroke-width="1.6"/>
    <text x="624" y="295" fill="#FCFAF3">gate v2 decision</text><text x="624" y="317" fill="#F5E0CF" font-size="12">SERVE · VERIFY_FIRST · REFUSE</text>
    <line x1="700" y1="216" x2="700" y2="262" stroke="#C4501B" stroke-width="1.8" marker-end="url(#arro)"/>
    <rect x="880" y="266" width="280" height="70" rx="7" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.6"/>
    <text x="894" y="290" font-size="13">decision ticket: coordinate + granularity,</text>
    <text x="894" y="309" font-size="13">radius + n + coverage, typed reasons,</text>
    <text x="894" y="328" font-size="13">ranked losers · no coordinate on refuse</text>
    <line x1="840" y1="301" x2="876" y2="301" stroke="#C4501B" stroke-width="1.8" marker-end="url(#arro)"/>
    <line x1="1080" y1="216" x2="1080" y2="262" stroke="#C4501B" stroke-width="1.8" marker-end="url(#arro)"/>
  </g>

  <!-- ── lane 2: field evidence path ─────────────────────────────────────── -->
  <rect x="24" y="452" width="1152" height="330" fill="#E3EBDA" opacity="0.4" stroke="#3B7449" stroke-width="1.4"/>
  <text x="40" y="482" font-size="14" fill="#3B7449" font-weight="bold" font-family="DejaVu Sans Mono, monospace">FIELD EVIDENCE PATH · append-only, idempotent, as-of</text>

  <g font-size="14" fill="#211D14">
    <rect x="40" y="506" width="190" height="70" rx="7" fill="#FCFAF3" stroke="#3B7449" stroke-width="1.6"/>
    <text x="54" y="535">field visit</text><text x="54" y="557" fill="#60584B" font-size="12">GPS trace · dwell · outcome</text>
    <rect x="252" y="506" width="200" height="70" rx="7" fill="#FCFAF3" stroke="#3B7449" stroke-width="1.6"/>
    <text x="266" y="535">tail-3 estimator</text><text x="266" y="557" fill="#60584B" font-size="12">median of last 3 fixes · 7.6 m</text>
    <rect x="474" y="506" width="200" height="70" rx="7" fill="#FCFAF3" stroke="#3B7449" stroke-width="1.6"/>
    <text x="488" y="535">integrity weighting</text><text x="488" y="557" fill="#60584B" font-size="12">media · trail · dwell · agent</text>
    <rect x="696" y="506" width="200" height="70" rx="7" fill="#FCFAF3" stroke="#3B7449" stroke-width="1.6"/>
    <text x="710" y="535">belief update</text><text x="710" y="557" fill="#60584B" font-size="12">≤ 1 tier step · 2 to promote</text>
    <rect x="918" y="506" width="242" height="70" rx="7" fill="#ECE0EA" stroke="#6D4F6E" stroke-width="1.6"/>
    <text x="932" y="535" fill="#4a354b">place memory</text><text x="932" y="557" fill="#6D4F6E" font-size="12">evidence-derived priors only</text>

    <line x1="230" y1="541" x2="248" y2="541" stroke="#3B7449" stroke-width="1.8" marker-end="url(#arrg)"/>
    <line x1="452" y1="541" x2="470" y2="541" stroke="#3B7449" stroke-width="1.8" marker-end="url(#arrg)"/>
    <line x1="674" y1="541" x2="692" y2="541" stroke="#3B7449" stroke-width="1.8" marker-end="url(#arrg)"/>
    <line x1="896" y1="541" x2="914" y2="541" stroke="#3B7449" stroke-width="1.8" marker-end="url(#arrg)"/>

    <rect x="696" y="636" width="200" height="70" rx="7" fill="#FCFAF3" stroke="#B23A2B" stroke-width="1.6"/>
    <text x="710" y="665">negatives</text><text x="710" y="687" fill="#B23A2B" font-size="12">demote · widen · task · never move</text>
    <line x1="796" y1="576" x2="796" y2="632" stroke="#B23A2B" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="988" y="636" width="172" height="70" rx="7" fill="#FCFAF3" stroke="#8D6117" stroke-width="1.6"/>
    <text x="1002" y="665">verify queue</text><text x="1002" y="687" fill="#60584B" font-size="12">278 open cases</text>
    <line x1="896" y1="671" x2="984" y2="671" stroke="#B23A2B" stroke-width="1.8" marker-end="url(#arr)"/>
    <!-- memory feeds production candidates -->
    <line x1="1039" y1="506" x2="1039" y2="430" stroke="#6D4F6E" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="1032" y="446" font-size="12" fill="#6D4F6E" text-anchor="end">eligible memory enters the candidate set (as-of)</text>
  </g>

  <!-- ── lane 3: offline evaluation only ─────────────────────────────────── -->
  <rect x="24" y="812" width="1152" height="180" fill="#E2E5E4" opacity="0.45" stroke="#51616C" stroke-width="1.4"/>
  <text x="40" y="842" font-size="14" fill="#51616C" font-weight="bold" font-family="DejaVu Sans Mono, monospace">OFFLINE EVALUATION ONLY · no model file, no request-path import</text>

  <g font-size="14" fill="#211D14">
    <rect x="40" y="866" width="250" height="70" rx="7" fill="#FCFAF3" stroke="#51616C" stroke-width="1.6"/>
    <text x="54" y="895">experiments A–D + precision</text><text x="54" y="917" fill="#60584B" font-size="12">frozen data · seed 7 · 10k boot</text>
    <rect x="320" y="866" width="250" height="70" rx="7" fill="#FCFAF3" stroke="#51616C" stroke-width="1.6"/>
    <text x="334" y="895">challengers fit in memory</text><text x="334" y="917" fill="#60584B" font-size="12">LOGISTIC · LAMBDAMART · PAIRWISE</text>
    <rect x="600" y="866" width="250" height="70" rx="7" fill="#FCFAF3" stroke="#51616C" stroke-width="1.6"/>
    <text x="614" y="895">promotion gate</text><text x="614" y="917" fill="#60584B" font-size="12">must beat RULE beyond interval</text>
    <rect x="880" y="866" width="280" height="70" rx="7" fill="#FCFAF3" stroke="#B23A2B" stroke-width="1.6"/>
    <text x="894" y="895" fill="#B23A2B">RESULT: none promoted</text><text x="894" y="917" fill="#60584B" font-size="12">RULE stays in production</text>
    <line x1="290" y1="901" x2="316" y2="901" stroke="#51616C" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="570" y1="901" x2="596" y2="901" stroke="#51616C" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="850" y1="901" x2="876" y2="901" stroke="#51616C" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- ── lane 4: persistence ──────────────────────────────────────────────── -->
  <rect x="24" y="1022" width="1152" height="150" fill="#F4F0E4" opacity="0.8" stroke="#C9C0A6" stroke-width="1.4"/>
  <text x="40" y="1052" font-size="14" fill="#60584B" font-weight="bold" font-family="DejaVu Sans Mono, monospace">PERSISTENCE · local SQLite store · runtime indexes · offline packs</text>

  <g font-size="13" fill="#211D14">
    <rect x="40" y="1076" width="270" height="64" rx="7" fill="#FCFAF3" stroke="#C9C0A6" stroke-width="1.4"/>
    <text x="54" y="1103">SQLite store (schema store-2)</text><text x="54" y="1124" fill="#60584B" font-size="12">5,578 observations · 2,757 belief versions</text>
    <rect x="330" y="1076" width="270" height="64" rx="7" fill="#FCFAF3" stroke="#C9C0A6" stroke-width="1.4"/>
    <text x="344" y="1103">runtime indexes</text><text x="344" y="1124" fill="#60584B" font-size="12">3,117 addresses · 3,007 blocks · IDF</text>
    <rect x="620" y="1076" width="250" height="64" rx="7" fill="#FCFAF3" stroke="#C9C0A6" stroke-width="1.4"/>
    <text x="634" y="1103">offline packs</text><text x="634" y="1124" fill="#60584B" font-size="12">packs T1/T2 · valid until 2026-06-06</text>
    <rect x="890" y="1076" width="270" height="64" rx="7" fill="#FCFAF3" stroke="#C9C0A6" stroke-width="1.4"/>
    <text x="904" y="1103">operator workbench</text><text x="904" y="1124" fill="#60584B" font-size="12">reads only via the runtime API</text>
  </g>

  <text x="28" y="1216" font-size="13" fill="#60584B">The offline lane feeds no module above the persistence line; the separation is enforced in code, imports and tests — not in prose.</text>
</svg>
