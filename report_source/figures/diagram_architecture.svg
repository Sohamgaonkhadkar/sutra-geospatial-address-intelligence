<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" font-family="DejaVu Sans Mono, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60584B"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C4501B"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B7449"/>
    </marker>
  </defs>
  <rect width="1180" height="780" fill="#FBF9F2"/>
  <text x="24" y="34" font-size="15" font-weight="bold" fill="#211D14" font-family="DejaVu Serif, serif">SUTRA end-to-end architecture — production, field evidence, offline</text>
  <text x="24" y="52" font-size="9.5" fill="#60584B">schematic · every node maps to a repository module · orange = production · green = evidence · plum = memory · slate = offline-only</text>

  <!-- lane 1: production request path -->
  <rect x="24" y="70" width="1132" height="220" fill="#F5E0CF" opacity="0.35" stroke="#C4501B" stroke-width="1"/>
  <text x="36" y="90" font-size="10" fill="#A63E12" font-weight="bold">PRODUCTION REQUEST PATH · sutra/resolve.py · candidates.py · ranking.py · belief.py · uncertainty.py · eligibility.py</text>

  <g font-size="9.5" fill="#211D14">
    <rect x="40" y="110" width="150" height="52" rx="6" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.2"/>
    <text x="52" y="131">raw address</text><text x="52" y="146" fill="#60584B">+ request purpose</text>
    <rect x="220" y="110" width="160" height="52" rx="6" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.2"/>
    <text x="232" y="131">normalise / parse</text><text x="232" y="146" fill="#60584B">NFKC · abbrev · spans</text>
    <rect x="410" y="110" width="160" height="52" rx="6" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.2"/>
    <text x="422" y="131">entity resolution</text><text x="422" y="146" fill="#60584B">town · locality (v2)</text>
    <rect x="600" y="110" width="180" height="52" rx="6" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.2"/>
    <text x="612" y="131">candidate generation</text><text x="612" y="146" fill="#60584B">5 static + evidence arms</text>
    <rect x="810" y="110" width="150" height="52" rx="6" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.2"/>
    <text x="822" y="131">RULE ranker</text><text x="822" y="146" fill="#60584B">reason-coded · frozen</text>
    <rect x="990" y="110" width="150" height="52" rx="6" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.2"/>
    <text x="1002" y="131">belief + uncertainty</text><text x="1002" y="146" fill="#60584B">tier · radius-map-v1</text>

    <rect x="600" y="200" width="180" height="56" rx="6" fill="#C4501B"/>
    <text x="616" y="222" fill="#FCFAF3">gate-v2 decision</text><text x="616" y="238" fill="#F5E0CF">SERVE · VERIFY_FIRST · REFUSE</text>
    <rect x="830" y="200" width="310" height="56" rx="6" fill="#FCFAF3" stroke="#C4501B" stroke-width="1.2"/>
    <text x="842" y="220">decision ticket: coordinate+granularity,</text>
    <text x="842" y="234">radius+n+coverage, typed reasons,</text>
    <text x="842" y="248">ranked losers · no coordinate on refuse</text>
  </g>
  <g stroke="#C4501B" stroke-width="1.3" fill="none">
    <path d="M190,136 H220" marker-end="url(#arro)"/><path d="M380,136 H410" marker-end="url(#arro)"/>
    <path d="M570,136 H600" marker-end="url(#arro)"/><path d="M780,136 H810" marker-end="url(#arro)"/>
    <path d="M960,136 H990" marker-end="url(#arro)"/><path d="M1065,162 V200" marker-end="url(#arro)"/>
    <path d="M690,162 V200" marker-end="url(#arro)"/><path d="M780,228 H830" marker-end="url(#arro)"/>
  </g>

  <!-- lane 2: field evidence -->
  <rect x="24" y="310" width="1132" height="210" fill="#E3EBDA" opacity="0.4" stroke="#3B7449" stroke-width="1"/>
  <text x="36" y="330" font-size="10" fill="#3B7449" font-weight="bold">FIELD EVIDENCE PATH · sutra/seed.py · evidence.py · belief.py · asof.py — append-only, idempotent, as-of</text>
  <g font-size="9.5" fill="#211D14">
    <rect x="40" y="350" width="160" height="52" rx="6" fill="#FCFAF3" stroke="#3B7449" stroke-width="1.2"/>
    <text x="52" y="371">field visit</text><text x="52" y="386" fill="#60584B">GPS trace · dwell · outcome</text>
    <rect x="230" y="350" width="180" height="52" rx="6" fill="#FCFAF3" stroke="#3B7449" stroke-width="1.2"/>
    <text x="242" y="371">tail-3 estimator</text><text x="242" y="386" fill="#60584B">coord-v2-trace-tail · 7.6 m</text>
    <rect x="440" y="350" width="180" height="52" rx="6" fill="#FCFAF3" stroke="#3B7449" stroke-width="1.2"/>
    <text x="452" y="371">integrity weighting</text><text x="452" y="386" fill="#60584B">media · trail · dwell · agent</text>
    <rect x="650" y="350" width="170" height="52" rx="6" fill="#FCFAF3" stroke="#3B7449" stroke-width="1.2"/>
    <text x="662" y="371">belief update</text><text x="662" y="386" fill="#60584B">≤1 tier step · 2 to promote</text>
    <rect x="650" y="440" width="170" height="52" rx="6" fill="#FCFAF3" stroke="#B23A2B" stroke-width="1.2"/>
    <text x="662" y="461">negatives</text><text x="662" y="476" fill="#B23A2B">demote · widen · task · never move</text>
    <rect x="860" y="350" width="150" height="52" rx="6" fill="#ECE0EA" stroke="#6D4F6E" stroke-width="1.2"/>
    <text x="872" y="371">place memory</text><text x="872" y="386" fill="#60584B">evidence-derived only</text>
    <rect x="1040" y="440" width="100" height="52" rx="6" fill="#FCFAF3" stroke="#8D6117" stroke-width="1.2"/>
    <text x="1050" y="461">verify</text><text x="1050" y="476" fill="#8D6117">queue</text>
  </g>
  <g stroke="#3B7449" stroke-width="1.3" fill="none">
    <path d="M200,376 H230" marker-end="url(#arrg)"/><path d="M410,376 H440" marker-end="url(#arrg)"/>
    <path d="M620,376 H650" marker-end="url(#arrg)"/><path d="M820,376 H860" marker-end="url(#arrg)"/>
  </g>
  <g stroke="#B23A2B" stroke-width="1.2" fill="none">
    <path d="M735,402 V440" marker-end="url(#arr)"/><path d="M820,466 H1040" marker-end="url(#arr)"/>
  </g>
  <path d="M935,350 V300 V262" stroke="#6D4F6E" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  <text x="945" y="300" font-size="9" fill="#6D4F6E">eligible memory enters candidate set (as-of)</text>

  <!-- lane 3: offline -->
  <rect x="24" y="540" width="1132" height="110" fill="#E2E5E4" opacity="0.5" stroke="#51616C" stroke-width="1"/>
  <text x="36" y="560" font-size="10" fill="#51616C" font-weight="bold">OFFLINE EVALUATION ONLY · tools/experiment_*.py · precision_opt.py · evidence_memory_policy.py — no model file, no request-path import</text>
  <g font-size="9.5" fill="#211D14">
    <rect x="40" y="580" width="200" height="48" rx="6" fill="#FCFAF3" stroke="#51616C" stroke-width="1.2"/>
    <text x="52" y="600">experiments A–D + precision</text><text x="52" y="614" fill="#60584B">frozen data · seed 7 · 10k boot</text>
    <rect x="280" y="580" width="200" height="48" rx="6" fill="#FCFAF3" stroke="#51616C" stroke-width="1.2"/>
    <text x="292" y="600">challengers fit in memory</text><text x="292" y="614" fill="#60584B">LOGISTIC · LAMBDAMART · PAIRWISE</text>
    <rect x="520" y="580" width="190" height="48" rx="6" fill="#FCFAF3" stroke="#51616C" stroke-width="1.2"/>
    <text x="532" y="600">promotion gate</text><text x="532" y="614" fill="#60584B">beat RULE beyond interval</text>
    <rect x="750" y="580" width="220" height="48" rx="6" fill="#FCFAF3" stroke="#B23A2B" stroke-width="1.2"/>
    <text x="762" y="600" fill="#B23A2B">RESULT: none promoted</text><text x="762" y="614" fill="#60584B">RULE stays in production</text>
  </g>
  <g stroke="#51616C" stroke-width="1.2" fill="none">
    <path d="M240,604 H280" marker-end="url(#arr)"/><path d="M480,604 H520" marker-end="url(#arr)"/><path d="M710,604 H750" marker-end="url(#arr)"/>
  </g>

  <!-- persistence -->
  <rect x="24" y="670" width="1132" height="86" fill="#F4F0E4" stroke="#C9C0A6" stroke-width="1"/>
  <text x="36" y="690" font-size="10" fill="#4A4433" font-weight="bold">PERSISTENCE · data/derived/runtime/sutra_store.sqlite (store-2) · runtime indexes · offline packs (contains_truth: false)</text>
  <g font-size="9.5" fill="#211D14">
    <rect x="40" y="704" width="250" height="40" rx="6" fill="#FCFAF3" stroke="#C9C0A6"/>
    <text x="52" y="728">5,578 observations · 2,757 belief versions</text>
    <rect x="310" y="704" width="250" height="40" rx="6" fill="#FCFAF3" stroke="#C9C0A6"/>
    <text x="322" y="728">3,117 addresses · 3,007 place blocks · token IDF</text>
    <rect x="580" y="704" width="250" height="40" rx="6" fill="#FCFAF3" stroke="#C9C0A6"/>
    <text x="592" y="728">packs T1/T2 · valid until 2026-06-08</text>
    <rect x="850" y="704" width="290" height="40" rx="6" fill="#FCFAF3" stroke="#C9C0A6"/>
    <text x="862" y="728">workbench (battle_model/) reads only via API</text>
  </g>
</svg>
